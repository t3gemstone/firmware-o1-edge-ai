version: '3'

vars:
  PKG_NAME: 't3-edgeai-firmware'
  PKG_VERSION: '{{ .PKG_VERSION | default "11.0.1" }}'
  PKG_ARCH: '{{ .PKG_ARCH | default "arm64" }}'
  FW_DIRS: 'vision_apps_eaik'
  MAINT_SCRIPTS: 'preinst postinst postrm'
  BUILD_DIR: '{{ .ROOT_DIR }}/build'
  STAGE_DIR: '{{ .BUILD_DIR }}/{{ .PKG_NAME }}_{{ .PKG_VERSION }}_{{ .PKG_ARCH }}'
  DEB_FILE: '{{ .STAGE_DIR }}.deb'

env:
  # Clamp file timestamps to the last commit so that rebuilding the same
  # commit produces a byte-identical package.
  SOURCE_DATE_EPOCH:
    sh: git log -1 --format=%ct 2>/dev/null || date +%s

tasks:

  default:
    silent: true
    cmds:
      - task --list
      - echo -e "\nEnvironment:\n"
      - echo "  PKG_NAME     = '{{ .PKG_NAME }}'"
      - echo "  PKG_VERSION  = '{{ .PKG_VERSION }}'"
      - echo "  PKG_ARCH     = '{{ .PKG_ARCH }}'"
      - echo "  DEB_FILE     = '{{ .DEB_FILE }}'"
      - echo ""

  stage:
    desc: Prepare the package root under build/
    preconditions:
      - sh: echo "{{ .PKG_VERSION }}" | grep -Eq '^[0-9][A-Za-z0-9.+~-]*$'
        msg: "Invalid Debian version: '{{ .PKG_VERSION }}'"
    cmds:
      - rm -rf "{{ .STAGE_DIR }}"
      - mkdir -p "{{ .STAGE_DIR }}/DEBIAN" "{{ .STAGE_DIR }}/lib/firmware"
      - cp -r {{ .FW_DIRS }} "{{ .STAGE_DIR }}/lib/firmware/"
      - |
        while read -r target link; do
          case "$target" in ''|\#*) continue ;; esac
          ln -sfn "$target" "{{ .STAGE_DIR }}/lib/firmware/$link"
        done < packaging/links
      # Installed-Size lets apt check the free disk space before installing.
      # It is in KiB, each file rounded up as dpkg-gencontrol does, and is
      # computed from file sizes only, so that it is the same on every
      # filesystem and the package stays reproducible.
      - |
        size=$(cd "{{ .STAGE_DIR }}" && find lib -type f -printf '%s\n' \
          | awk '{ kib += int(($1 + 1023) / 1024) } END { print kib + 0 }')
        sed -e "s/@PACKAGE@/{{ .PKG_NAME }}/" \
            -e "s/@VERSION@/{{ .PKG_VERSION }}/" \
            -e "s/@ARCH@/{{ .PKG_ARCH }}/" \
            -e "s/@INSTALLED_SIZE@/$size/" \
            packaging/control.in > "{{ .STAGE_DIR }}/DEBIAN/control"
      # Fill @FW_FILES@ in the maintainer scripts with every file and symlink
      # the package installs, one path per line, for preinst and postrm to
      # divert and restore.
      - (cd "{{ .STAGE_DIR }}" && find lib ! -type d | LC_ALL=C sort | sed 's|^|/|') > "{{ .BUILD_DIR }}/fw-files.txt"
      - |
        for script in {{ .MAINT_SCRIPTS }}; do
          sed -e '/^@FW_FILES@$/{r {{ .BUILD_DIR }}/fw-files.txt' -e 'd}' \
            "packaging/$script" > "{{ .STAGE_DIR }}/DEBIAN/$script"
        done
      - rm -f "{{ .BUILD_DIR }}/fw-files.txt"
      - find "{{ .STAGE_DIR }}" -type d -exec chmod 0755 {} +
      - find "{{ .STAGE_DIR }}" -type f -exec chmod 0644 {} +
      # dpkg runs maintainer scripts directly, so they must stay
      # executable; the generic chmod above would otherwise flatten them.
      - for script in {{ .MAINT_SCRIPTS }}; do chmod 0755 "{{ .STAGE_DIR }}/DEBIAN/$script"; done

  build:
    desc: Build the .deb package into build/
    preconditions:
      - sh: command -v dpkg-deb
        msg: "dpkg-deb not found, install the 'dpkg' package"
    cmds:
      - task: stage
      # xz instead of Ubuntu's zstd default, so that older dpkg and
      # repository tools can also read the package.
      - dpkg-deb --root-owner-group -Zxz --build "{{ .STAGE_DIR }}" "{{ .DEB_FILE }}"
      - task: check

  check:
    desc: Verify that the built package contains every firmware file, symlink and maintainer script
    preconditions:
      - sh: test -f "{{ .DEB_FILE }}"
        msg: "{{ .DEB_FILE }} not found, run 'task build' first"
    cmds:
      - dpkg-deb --info "{{ .DEB_FILE }}"
      - dpkg-deb --contents "{{ .DEB_FILE }}"
      - |
        set -e
        dpkg-deb --contents "{{ .DEB_FILE }}" > "{{ .BUILD_DIR }}/contents.txt"
        for f in $(find {{ .FW_DIRS }} -type f | sort); do
          grep -q " \./lib/firmware/$f\$" "{{ .BUILD_DIR }}/contents.txt" \
            || { echo "missing file: $f"; exit 1; }
        done
        while read -r target link; do
          case "$target" in ''|\#*) continue ;; esac
          grep -q " \./lib/firmware/$link -> $target\$" "{{ .BUILD_DIR }}/contents.txt" \
            || { echo "missing symlink: $link -> $target"; exit 1; }
          grep -q " \./lib/firmware/$target\$" "{{ .BUILD_DIR }}/contents.txt" \
            || { echo "dangling symlink: $link -> $target"; exit 1; }
        done < packaging/links
        # Start from an empty directory, so that scripts left over from an
        # earlier, failed check cannot hide a missing one.
        rm -rf "{{ .BUILD_DIR }}/control"
        dpkg-deb --control "{{ .DEB_FILE }}" "{{ .BUILD_DIR }}/control"
        for script in {{ .MAINT_SCRIPTS }}; do
          test -x "{{ .BUILD_DIR }}/control/$script" \
            || { echo "missing or non-executable script: DEBIAN/$script"; exit 1; }
          if grep -q '@FW_FILES@' "{{ .BUILD_DIR }}/control/$script"; then
            echo "unfilled @FW_FILES@ in DEBIAN/$script"; exit 1
          fi
        done
        rm -rf "{{ .BUILD_DIR }}/control"
        rm -f "{{ .BUILD_DIR }}/contents.txt"
        echo "OK: {{ .DEB_FILE }}"

  version:
    desc: Print the package version
    silent: true
    cmds:
      - echo "{{ .PKG_VERSION }}"

  clean:
    desc: Remove the build directory
    cmds:
      - rm -rf "{{ .BUILD_DIR }}"
